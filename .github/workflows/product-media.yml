name: Capture product evidence
on:
  push:
    branches: [codex/studio-completion-review]
    paths: ['scripts/capture-products.mjs', '.github/workflows/product-media.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/capture-products.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-evidence
          path: product-evidence/
          retention-days: 7
  commit-evidence:
    needs: capture
    if: github.ref == 'refs/heads/codex/studio-completion-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studio-completion-review
      - uses: actions/download-artifact@v4
        with:
          name: product-evidence
          path: product-evidence
      - name: Commit only validated public UI captures
        run: |
          mkdir -p public/images/cases
          for f in clawtide-chat.jpg clawtide-tasks.jpg threadcove-empty.jpg threadcove-conversation.jpg manifest.json; do
            test -s "product-evidence/$f"
            cp "product-evidence/$f" "public/images/cases/$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/cases
          git diff --cached --quiet && exit 0
          git commit -m 'media: add versioned product UI captures with explicit fixture provenance'
          git push origin HEAD:codex/studio-completion-review
